<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MDSIS</title>

    <style>
        :root {
            --mack-red: #c00000;
            --mack-red-dark: #8b0000;
            --bg-light: #f3f6fb;
            --text-muted: #6c757d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg-light);
            min-height: 100vh;
        }

        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 36px;
            border-radius: 18px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.10);
        }

        .login-title {
            text-align: center;
            color: var(--mack-red);
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .login-subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d9dee7;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--mack-red);
            box-shadow: 0 0 0 3px rgba(192, 0, 0, 0.12);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: var(--mack-red);
            color: white;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            margin-top: 6px;
        }

        .btn-login:hover {
            background: var(--mack-red-dark);
        }

        .register-text {
            margin-top: 24px;
            text-align: center;
            color: var(--text-muted);
        }

        .register-text a {
            color: var(--mack-red);
            text-decoration: none;
            font-weight: 700;
        }

        .register-text a:hover {
            color: var(--mack-red-dark);
        }

        .alert-error {
            background: #fff5f5;
            color: var(--mack-red-dark);
            border: 1px solid #ffd0d0;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 18px;
            text-align: center;
        }
    </style>
</head>

<body>
    <main class="login-page">
        <section class="login-card">

            <h1 class="login-title">MDSIS</h1>
            <p class="login-subtitle">Acesse sua conta para ver seus indicadores</p>

            {% if form.errors %}
                <div class="alert-error">
                    Usuário ou senha inválidos.
                </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <div class="form-group">
                    <label for="username">Usuário</label>
                    <input
                        type="text"
                        name="username"
                        id="username"
                        class="form-control"
                        placeholder="Digite seu usuário"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <input
                        type="password"
                        name="password"
                        id="password"
                        class="form-control"
                        placeholder="Digite sua senha"
                        required
                    >
                </div>

                <button type="submit" class="btn-login">
                    Entrar
                </button>
            </form>

            <p class="register-text">
                Ainda não tem conta?
                <a href="{% url 'cadastro' %}">Cadastre-se</a>
            </p>

        </section>
    </main>
</body>
</html>
