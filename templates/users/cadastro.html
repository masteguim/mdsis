<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - MDSIS</title>

    <style>
        :root {
            --mack-red: #c00000;
            --mack-red-dark: #8b0000;
            --bg-light: #f3f6fb;
            --text-muted: #6c757d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg-light);
            min-height: 100vh;
        }

        .register-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .register-card {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 36px;
            border-radius: 18px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.10);
        }

        .register-title {
            text-align: center;
            color: var(--mack-red);
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .register-subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d9dee7;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--mack-red);
            box-shadow: 0 0 0 3px rgba(192, 0, 0, 0.12);
        }

        .btn-register {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: var(--mack-red);
            color: white;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            margin-top: 6px;
        }

        .btn-register:hover {
            background: var(--mack-red-dark);
        }

        .login-link {
            margin-top: 24px;
            text-align: center;
            color: var(--text-muted);
        }

        .login-link a {
            color: var(--mack-red);
            text-decoration: none;
            font-weight: 700;
        }

        .login-link a:hover {
            color: var(--mack-red-dark);
        }

        .errorlist {
            color: var(--mack-red-dark);
            font-size: 13px;
            margin-top: 6px;
            padding-left: 18px;
        }
    </style>
</head>

<body>
    <main class="register-page">
        <section class="register-card">

            <h1 class="register-title">Criar conta</h1>
            <p class="register-subtitle">Cadastre-se para acessar o sistema</p>

            <form method="post">
                {% csrf_token %}

                <div class="form-group">
                    <label for="{{ form.username.id_for_label }}">Usuário</label>
                    {{ form.username }}
                    {{ form.username.errors }}
                </div>

                <div class="form-group">
                    <label for="{{ form.email.id_for_label }}">Email</label>
                    {{ form.email }}
                    {{ form.email.errors }}
                </div>

                <div class="form-group">
                    <label for="{{ form.password1.id_for_label }}">Senha</label>
                    {{ form.password1 }}
                    {{ form.password1.errors }}
                </div>

                <div class="form-group">
                    <label for="{{ form.password2.id_for_label }}">Confirmar senha</label>
                    {{ form.password2 }}
                    {{ form.password2.errors }}
                </div>

                <button type="submit" class="btn-register">
                    Cadastrar
                </button>
            </form>

            <p class="login-link">
                Já tem conta?
                <a href="{% url 'login' %}">Entrar</a>
            </p>

        </section>
    </main>
</body>
</html>
