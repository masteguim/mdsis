{% extends 'base/base.html' %}

{% block title %}Nova Meta{% endblock %}

{% block content %}
<div class="row justify-content-center fade-in">
    <div class="col-lg-7">
        <div class="card border-0 p-5">

            <h4 class="fw-bold mb-4">Criar Nova Meta</h4>

            <form method="post">
                {% csrf_token %}

                <div class="row g-4">

                    <div class="col-12">
                        <label class="form-label small fw-bold text-muted">TÍTULO</label>
                        {{ form.titulo }}
                    </div>

                    <div class="col-md-6">
                        <label class="form-label small fw-bold text-muted">TIPO DE META</label>
                        {{ form.tipo }}
                    </div>

                    <div class="col-md-6">
                        <label class="form-label small fw-bold text-muted">STATUS</label>
                        {{ form.status }}
                    </div>

                    <div class="col-md-6">
                        <label class="form-label small fw-bold text-muted">UNIDADE</label>
                        {{ form.unidade }}
                    </div>

                    <div class="col-md-6">
                        <label class="form-label small fw-bold text-muted">QUANTIDADE TOTAL</label>
                        {{ form.quantidade_total }}
                    </div>

                    <div class="col-md-6">
                        <label class="form-label small fw-bold text-muted">PRAZO</label>
                        {{ form.prazo }}
                    </div>

                    <div class="col-12">
                        <label class="form-label small fw-bold text-muted">DESCRIÇÃO</label>
                        {{ form.descricao }}
                    </div>

                    <div class="col-12 pt-3">
                        <button type="submit" class="btn btn-mack btn-lg w-100">
                            Criar Meta
                        </button>
                    </div>

                </div>
            </form>

        </div>
    </div>
</div>
{% endblock %}
