name: Django CI (MDSIS)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    # Sistema operacional da máquina virtual do GitHub
    runs-on: ubuntu-latest

    steps:
    # Passo 1: Baixa o código do repositório para a máquina do GitHub
    - name: Checkout code
      uses: actions/checkout@v4

    # Passo 2: Configura a versão correta do Python
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # Passo 3: Cache de dependências (acelera os próximos deploys)
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    # Passo 4: Instala o Django e pacotes necessários
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install django; fi

    # Passo 5: Executa os testes automatizados do ecossistema MDSIS
    - name: Run Tests
      run: |
        python manage.py test